name: Daily briefing

on:
  schedule:
    # 10:20 UTC = 6:20am EDT / 5:20am EST
    - cron: "20 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/briefing/package-lock.json

      - name: Install
        working-directory: scripts/briefing
        run: npm ci

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/briefing/generate.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/briefing/data
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Daily briefing $(TZ=America/New_York date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the push will still deploy on the next build"
